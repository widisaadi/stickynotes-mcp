<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Sticky Notes MCP</title>
  <desc id="description">An editorial banner in warm cream, charcoal, and paper yellow. A small stack of notes accompanies the title: Sticky Notes MCP. Your desktop notes, connected to your AI tools.</desc>

  <rect width="1600" height="560" fill="#F4F1E9"/>
  <rect x="0.5" y="0.5" width="1599" height="559" stroke="#D8D3C7"/>

  <g fill="#5E6056" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="2.4">
    <text x="76" y="72">WINDOWS / MODEL CONTEXT PROTOCOL</text>
  </g>

  <g fill="#292C27">
    <text x="70" y="211" font-family="Georgia, 'Times New Roman', serif" font-size="112" letter-spacing="-5">Sticky Notes</text>
    <text x="73" y="328" font-family="'Segoe UI', Arial, sans-serif" font-size="100" font-weight="600" letter-spacing="-5">MCP</text>
  </g>
  <path d="M78 350H281" stroke="#A99451" stroke-width="4"/>
  <text x="78" y="403" fill="#5E6056" font-family="'Segoe UI', Arial, sans-serif" font-size="25">Your desktop notes, connected to your AI tools.</text>

  <!-- A restrained paper study: flat color, offset sheets, a folded corner. -->
  <g transform="translate(1040 108)">
    <g transform="rotate(8 165 158)">
      <rect x="31" y="4" width="300" height="294" fill="#D5D9C9"/>
      <path d="M62 43H300" stroke="#BCC3AE"/>
    </g>
    <g transform="rotate(-6 154 165)">
      <path d="M3 36H306V282L255 333H3Z" fill="#292C27" fill-opacity="0.07" transform="translate(7 9)"/>
      <path d="M3 36H306V282L255 333H3Z" fill="#E8D68F"/>
      <path d="M3 36H306V70H3Z" fill="#DFCC83"/>
      <text x="33" y="126" fill="#3B3C30" font-family="Georgia, 'Times New Roman', serif" font-size="37" font-style="italic">For later.</text>
      <g stroke="#626044" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M34 166H48V180H34Z"/>
        <path d="M36 171L40 175L48 165"/>
        <path d="M66 174H252"/>
        <path d="M34 207H48V221H34Z"/>
        <path d="M66 215H229"/>
        <path d="M34 248H48V262H34Z"/>
        <path d="M66 256H201"/>
      </g>
      <path d="M255 333V282H306Z" fill="#C8B66F"/>
      <path d="M255 333V282H306" stroke="#B7A45F" stroke-opacity="0.45"/>
    </g>
  </g>

  <path d="M76 463H1524" stroke="#CBC6B8"/>
  <g fill="#5E6056" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="1.8">
    <text x="78" y="510">READ / WRITE / SEARCH / EXPORT</text>
    <text x="1522" y="510" text-anchor="end">PYTHON · STDIO · MIT</text>
  </g>
</svg>
